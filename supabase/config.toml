# Configuração local do Supabase CLI para o SynapseMed.
#
# Validado em 2026-09-03 rodando de fato contra Supabase CLI 2.116.0 +
# Docker local (`supabase start` / `supabase db reset` / `supabase test db`,
# todos com sucesso). Escrito à mão originalmente (antes de o CLI estar
# disponível neste ambiente), depois confirmado compatível com a versão
# real instalada.

project_id = "synapsemed"

[api]
enabled = true
port = 54321
# "app" NÃO está listado aqui de propósito: os helpers internos de
# autorização (app.is_admin_active, app.current_profile_status) não podem
# virar rota REST/RPC pública, mesmo tendo GRANT EXECUTE para "authenticated".
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Fase 5 — Google OAuth via Supabase Auth. client_id/secret são lidos de
# variáveis de ambiente (nunca hardcoded aqui) e precisam existir no shell
# antes de `supabase start`, mesmo que com valores placeholder — o CLI local
# falha ao subir se a env referenciada em env(...) não existir.
#
# Passo manual do usuário (fora do escopo desta etapa, tanto local quanto em
# produção): criar um OAuth Client ID no Google Cloud Console e definir
# SUPABASE_AUTH_GOOGLE_CLIENT_ID / SUPABASE_AUTH_GOOGLE_SECRET com os valores
# reais. Até lá, os placeholders abaixo permitem `supabase start` funcionar
# normalmente para o restante do fluxo (email/senha), mas o botão "Entrar com
# Google" retornará erro de autenticação ao ser clicado.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[analytics]
enabled = false

# 44-F: revisor de IA. A função não usa JWT de usuário: quem a chama é o
# agendador do banco (pg_cron + pg_net), com um segredo próprio no cabeçalho
# Authorization, conferido dentro da função (REVISOR_SEGREDO). Sem o segredo
# certo ela responde 401 e não faz nada.
[functions.revisar-envios]
verify_jwt = false
