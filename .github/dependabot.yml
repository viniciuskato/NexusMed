# Atualizações de dependências por PR (AUD-10). Cada PR passa pelo CI
# (`fast`/`full`) como qualquer outro — nada é mesclado automaticamente.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # minor/patch agrupados por tipo; majors ficam fora dos grupos e
      # chegam em PRs individuais.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
