name: CI

# Gate rápido (fast): typecheck, lint, unit, build. Gate completo (full): sobe
# Supabase local de verdade (Docker, serviço já presente nos runners
# `ubuntu-latest`) e roda pgTAP + Playwright contra ele. Nenhum dos dois jobs
# toca Supabase remoto ou produção — não há segredos de produção neste
# workflow.
#
# Quando roda: em todo PR (é o que o ruleset do `main` exige), no push do
# `main` (confere o que foi mesclado) e à mão (`workflow_dispatch`, para uma
# branch sem PR). NÃO roda no push de outras branches: com PR aberto, cada
# push disparava o CI duas vezes — pelo push e pelo PR, com `github.ref`
# diferentes, então o `concurrency` abaixo não cancelava uma pela outra —,
# dobrando o tempo e os downloads de imagem que batem no limite do registro
# (uma das duas execuções do PR #69 caiu assim, em 2026-09-23).
#
# Segurança: `pull_request` (nunca `pull_request_target`) — roda com o código
# do PR, mas SEM acesso a segredos de repositório (não há nenhum `secrets.*`
# usado aqui; tudo local/efêmero: Supabase local, chaves demo do próprio CLI).
# `permissions` no nível do workflow é o mínimo (`contents: read`) — nenhum
# job escreve no repositório, comenta em PR ou publica nada.
#
# Actions fixadas por SHA de commit completo (comentário `# vX.Y.Z` ao lado)
# e Supabase CLI em versão fixa — nada de tag móvel/`latest` (AUD-10). O
# Dependabot (`.github/dependabot.yml`) propõe as atualizações por PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # package.json#engines aceita >=20.19 <25, mas o cliente Supabase
  # (@supabase/supabase-js/realtime-js) exige `WebSocket` nativo do runtime
  # — indisponível antes do Node 22 — e falha já na criação do client
  # (import de src/lib/supabaseClient.ts), não só ao conectar de verdade.
  # Achado real do Prompt 13-B: nunca tinha sido testado no Node fixado
  # aqui (20.19) até esta validação em runner real; todas as sessões
  # anteriores rodaram localmente em Node mais novo. Fixado em 22 (LTS
  # dentro da faixa permitida) em vez de adicionar polyfill de WebSocket.
  NODE_VERSION: '22'

jobs:
  fast:
    name: fast (typecheck + lint + unit + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários (vitest)
        run: npm run test:unit

      # 45-H (AUD-07): o build falha sem as variáveis do Supabase, para não
      # publicar o modo demonstração. Aqui entram valores de MARCAÇÃO, só para
      # o bundle compilar: nenhum é credencial e nenhum projeto real é
      # contatado (o build não faz requisição). A produção usa as variáveis
      # reais da Vercel.
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-build-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder-nao-e-credencial

      - name: Gate — sem instrumentação de debug no bundle de produção
        run: npm run check:no-debug-bundle

      - name: Publicar build de produção (para inspeção manual se necessário)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-production
          path: dist/
          retention-days: 5

  full:
    name: full (pgTAP + Playwright contra Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: fast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0

      - name: Instalar navegadores do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Registros de imagem do Supabase: o anônimo compartilhado pelos runners do
      # GitHub bate em limite, e já bateu nos dois que usamos — ghcr.io com
      # "toomanyrequests" (23/09/2026, PR #63) e ECR Public com "Data limit
      # exceeded" (17/10/2026, run 39059003064 do PR #142: 6 execuções seguidas
      # caíram aqui). Por isso este passo tenta os 3 registros — public.ecr.aws,
      # ghcr.io e docker.io —, um por vez, uma tentativa em cada, e grava no
      # GITHUB_ENV o que funcionou: o pgTAP baixa outra imagem (a do pg_prove) e
      # lê o valor gravado. O setup-cli v3 já exporta ghcr.io por GITHUB_ENV, então
      # o laço exporta a variável a cada volta. O que já baixou fica no cache do
      # Docker (as camadas são compartilhadas por digest entre registros), e a
      # volta seguinte só busca o que faltou.
      #
      # `-x edge-runtime,studio`: o painel Studio não é usado; a função
      # supabase/functions/revisar-envios existe, mas está desligada pela D-12 e
      # nenhum teste a usa. Menos imagens, menos requisições. mailpit, storage e
      # imgproxy ficam: o cadastro por e-mail e a migration de políticas de
      # storage dependem deles.
      - name: Subir Supabase local (supabase start)
        id: supabase_start
        run: |
          for registry in public.ecr.aws ghcr.io docker.io; do
            export SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry
            if supabase start -x edge-runtime,studio; then
              echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry" >> "$GITHUB_ENV"
              echo "Supabase local no ar (registro $registry)."
              exit 0
            fi
            echo "::warning::supabase start falhou com o registro $registry."
            supabase stop --no-backup || true
            sleep 20
          done
          echo "::error::supabase start falhou nos três registros de imagem."
          exit 1

      - name: Resetar banco local (migrations + seed determinístico)
        run: supabase db reset

      - name: Aguardar Supabase local pronto (achado real do Prompt 13-B — `supabase db reset` retorna antes dos containers reiniciados responderem em runner real, e `npm run test:db` pula tudo silenciosamente sem isso)
        run: |
          for i in $(seq 1 30); do
            if supabase status -o json 2>/dev/null | grep -q '"DB_URL"'; then
              echo "Supabase local pronto (tentativa $i)."
              exit 0
            fi
            echo "Aguardando Supabase local responder (tentativa $i/30)..."
            sleep 2
          done
          echo "::error::Supabase local não respondeu DB_URL após 60s de espera."
          exit 1

      # Tenta o registro gravado pelo passo do start e depois os três em ordem.
      # Só troca de registro quando a falha é de download da imagem do pg_prove;
      # teste reprovado falha na hora, com o status do `npm run test:db`.
      - name: pgTAP (contratos de servidor)
        run: |
          for registry in "$SUPABASE_INTERNAL_IMAGE_REGISTRY" public.ecr.aws ghcr.io docker.io; do
            set +e
            out=$(SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry npm run test:db 2>&1)
            status=$?
            set -e
            echo "$out"
            [ $status -eq 0 ] && exit 0
            echo "$out" | grep -q "failed to pull docker image" || exit $status
            echo "::warning::download da imagem do pg_prove falhou com o registro $registry."
          done
          exit 1

      - name: Resetar banco local de novo — pgTAP (pg_prove) grava permanentemente, sem rollback (achado do Prompt 13-B)
        run: supabase db reset

      - name: Criar .env.test.local para o build do Playwright (Supabase LOCAL, nunca remoto)
        run: |
          API_URL=$(supabase status -o json | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).API_URL))")
          ANON_KEY=$(supabase status -o json | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).ANON_KEY))")
          echo "VITE_SUPABASE_URL=$API_URL" > .env.test.local
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> .env.test.local

      - name: Testes de navegador (Playwright/Chromium, cenários críticos)
        run: npm run test:e2e

      # Só quando o Supabase subiu: se o `supabase start` falhou, o container
      # não existe e esta checagem acusava "Sobraram  usuário(s)" com contagem
      # VAZIA — um segundo erro enganoso por cima da causa real.
      - name: Verificação de limpeza — zero fixtures e2e-13a- remanescentes
        if: always() && steps.supabase_start.outcome == 'success'
        run: |
          docker exec supabase_db_synapsemed psql -U postgres -t -A -c \
            "select count(*) from auth.users where email like 'e2e-13a-%';" | tee /tmp/e2e-leftover-count.txt
          COUNT=$(cat /tmp/e2e-leftover-count.txt | tr -d '[:space:]')
          if [ "$COUNT" != "0" ]; then
            echo "::error::Sobraram $COUNT usuário(s) e2e-13a- após a suíte — limpeza incompleta."
            exit 1
          fi

      - name: Publicar relatório/artefatos de falha do Playwright (sanitizados)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
